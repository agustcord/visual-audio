<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="Visual Audio Logo">
  <defs>
    <!-- Background Canvas Gradient: Deep Zinc 900 to Zinc 950 -->
    <linearGradient id="va-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Border Chamfer Gradient -->
    <linearGradient id="va-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#27272a" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#52525b" stop-opacity="0.50" />
    </linearGradient>

    <!-- Master Frequency Gradient: Cyan #06b6d4 to Violet #8b5cf6 -->
    <linearGradient id="va-freq-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="35%" stop-color="#22d3ee" />
      <stop offset="65%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- High-Luminance Peak Gradient -->
    <linearGradient id="va-peak-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Fluid Wave Gradient -->
    <linearGradient id="va-wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Ambient Acoustic Glow behind the V -->
    <radialGradient id="va-ambient-glow" cx="50%" cy="58%" r="46%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="va-neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Bar Glow Filter -->
    <filter id="va-bar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" opacity="0.6" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Squircle (Icon Base: 448x448 with 104px radius) -->
  <rect class="va-squircle" x="32" y="32" width="448" height="448" rx="104" ry="104"
        fill="url(#va-bg-grad)" stroke="url(#va-border-grad)" stroke-width="2.5" />

  <!-- Acoustic Ambient Atmosphere -->
  <circle class="va-ambient" cx="256" cy="285" r="175" fill="url(#va-ambient-glow)" />

  <!-- Symmetrical Equalizer Frequency Bars -->
  <g class="va-equalizer-bars" filter="url(#va-bar-glow)">
    <!-- Left Wing (Frequencies descending to vertex) -->
    <!-- Bar 0 (Sub/Low Outer): x=112, cy=160, h=110 -->
    <rect class="va-bar va-bar-0" x="105.5" y="105" width="13" height="110" rx="6.5" fill="url(#va-freq-grad)" />
    <!-- Bar 1: x=136, cy=197, h=130 -->
    <rect class="va-bar va-bar-1" x="129.5" y="132" width="13" height="130" rx="6.5" fill="url(#va-freq-grad)" />
    <!-- Bar 2: x=160, cy=234, h=95 -->
    <rect class="va-bar va-bar-2" x="153.5" y="186.5" width="13" height="95" rx="6.5" fill="url(#va-freq-grad)" />
    <!-- Bar 3: x=184, cy=271, h=120 -->
    <rect class="va-bar va-bar-3" x="177.5" y="211" width="13" height="120" rx="6.5" fill="url(#va-freq-grad)" />
    <!-- Bar 4: x=208, cy=308, h=80 -->
    <rect class="va-bar va-bar-4" x="201.5" y="268" width="13" height="80" rx="6.5" fill="url(#va-freq-grad)" />
    <!-- Bar 5: x=232, cy=345, h=60 -->
    <rect class="va-bar va-bar-5" x="225.5" y="315" width="13" height="60" rx="6.5" fill="url(#va-freq-grad)" />

    <!-- Center Apex Bar: x=256, h=44 -->
    <rect class="va-bar va-bar-6 va-bar-center" x="249.5" y="366" width="13" height="44" rx="6.5" fill="url(#va-freq-grad)" />

    <!-- Right Wing (Frequencies ascending from vertex - perfect symmetry) -->
    <!-- Bar 7: x=280, cy=345, h=60 -->
    <rect class="va-bar va-bar-7" x="273.5" y="315" width="13" height="60" rx="6.5" fill="url(#va-freq-grad)" />
    <!-- Bar 8: x=304, cy=308, h=80 -->
    <rect class="va-bar va-bar-8" x="297.5" y="268" width="13" height="80" rx="6.5" fill="url(#va-freq-grad)" />
    <!-- Bar 9: x=328, cy=271, h=120 -->
    <rect class="va-bar va-bar-9" x="321.5" y="211" width="13" height="120" rx="6.5" fill="url(#va-freq-grad)" />
    <!-- Bar 10: x=352, cy=234, h=95 -->
    <rect class="va-bar va-bar-10" x="345.5" y="186.5" width="13" height="95" rx="6.5" fill="url(#va-freq-grad)" />
    <!-- Bar 11: x=376, cy=197, h=130 -->
    <rect class="va-bar va-bar-11" x="369.5" y="132" width="13" height="130" rx="6.5" fill="url(#va-freq-grad)" />
    <!-- Bar 12 (Sub/High Outer): x=400, cy=160, h=110 -->
    <rect class="va-bar va-bar-12" x="393.5" y="105" width="13" height="110" rx="6.5" fill="url(#va-freq-grad)" />
  </g>

  <!-- Audio Peak Indicators (Floating DAW-style caps) -->
  <g class="va-peak-caps">
    <rect class="va-peak va-peak-0" x="105.5" y="93" width="13" height="3.5" rx="1.75" fill="url(#va-peak-grad)" opacity="0.95" />
    <rect class="va-peak va-peak-1" x="129.5" y="120" width="13" height="3.5" rx="1.75" fill="url(#va-peak-grad)" opacity="0.95" />
    <rect class="va-peak va-peak-2" x="153.5" y="174.5" width="13" height="3.5" rx="1.75" fill="url(#va-peak-grad)" opacity="0.95" />
    <rect class="va-peak va-peak-3" x="177.5" y="199" width="13" height="3.5" rx="1.75" fill="url(#va-peak-grad)" opacity="0.95" />
    <rect class="va-peak va-peak-4" x="201.5" y="256" width="13" height="3.5" rx="1.75" fill="url(#va-peak-grad)" opacity="0.95" />
    <rect class="va-peak va-peak-5" x="225.5" y="303" width="13" height="3.5" rx="1.75" fill="url(#va-peak-grad)" opacity="0.95" />
    
    <circle class="va-peak va-peak-6" cx="256" cy="355" r="3.2" fill="url(#va-peak-grad)" opacity="0.95" />

    <rect class="va-peak va-peak-7" x="273.5" y="303" width="13" height="3.5" rx="1.75" fill="url(#va-peak-grad)" opacity="0.95" />
    <rect class="va-peak va-peak-8" x="297.5" y="256" width="13" height="3.5" rx="1.75" fill="url(#va-peak-grad)" opacity="0.95" />
    <rect class="va-peak va-peak-9" x="321.5" y="199" width="13" height="3.5" rx="1.75" fill="url(#va-peak-grad)" opacity="0.95" />
    <rect class="va-peak va-peak-10" x="345.5" y="174.5" width="13" height="3.5" rx="1.75" fill="url(#va-peak-grad)" opacity="0.95" />
    <rect class="va-peak va-peak-11" x="369.5" y="120" width="13" height="3.5" rx="1.75" fill="url(#va-peak-grad)" opacity="0.95" />
    <rect class="va-peak va-peak-12" x="393.5" y="93" width="13" height="3.5" rx="1.75" fill="url(#va-peak-grad)" opacity="0.95" />
  </g>

  <!-- Secondary Acoustic Harmonic Wave (Faint depth ripple) -->
  <path class="va-wave-secondary"
        d="M 102,145 C 112,185 140,170 155,235 C 170,300 208,295 230,365 C 242,400 250,420 256,420 C 262,420 270,400 282,365 C 304,295 342,300 357,235 C 372,170 400,185 410,145"
        fill="none" stroke="url(#va-wave-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.45" />

  <!-- Primary Fluid Harmonic Audio Wave -->
  <path class="va-wave-primary"
        d="M 98,125 C 105,175 145,155 160,225 C 175,295 215,285 235,360 C 245,395 250,422 256,422 C 262,422 267,395 277,360 C 297,285 337,295 352,225 C 367,155 407,175 414,125"
        fill="none" stroke="url(#va-wave-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#va-neon-glow)" />

  <!-- Apex Radiant Node (Convergence Nexus) -->
  <g class="va-apex-node">
    <circle cx="256" cy="422" r="9" fill="#22d3ee" filter="url(#va-neon-glow)" />
    <circle cx="256" cy="422" r="4.5" fill="#ffffff" />
  </g>
</svg>
